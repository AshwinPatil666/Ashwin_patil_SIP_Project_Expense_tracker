<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise | Expense</title>
    <link rel="icon" type="image/png" href="../src/favicon.png">
    <link rel="stylesheet" href="../css/expense.css">
    <script type="module" src="../js/expenses.js" defer></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module"     src="../js/global-chat.js" defer></script>
     <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

     <script type="module" src="../js/sidebar.js" defer></script>
</head> 
<body>
<div class="dashboard">  
    
    <main class="expenses-page">

        <!-- Top Profile & Logout Header Bar -->
      

        <section class="page-header">
            <h1>Expenses</h1>
            <button class="add-expense-btn">
                + Add Expense
            </button>
        </section>

        <!-- Baaki saara code waisa hi rahega... -->

    <section class="expense-summary">

        <div class="summary-card">
            Total Expense
        </div>

        <div class="summary-card">
            This Month
        </div>

        <div class="summary-card">
            Categories
        </div>

        <div class="summary-card">
            Budget Left
        </div>

    </section>

 <section class="expense-filter">
        <!-- Category Filter -->
        <select id="filter-category">
            <option value="All">All Categories</option>
            <option value="Food">Food</option>
            <option value="Shopping">Shopping</option>
            <option value="Utility">Utility</option>
            <option value="Fuel">Fuel</option>
        </select>

        <!-- Payment Filter -->
        <select id="filter-payment">
            <option value="All">All Payments</option>
            <option value="UPI">UPI</option>
            <option value="Card">Card</option>
            <option value="Cash">Cash</option>
            <option value="Bank">Bank</option>
        </select>

        <!-- Date Filter -->
        <input type="date" id="filter-date">

        <!-- Search Filter -->
        <input type="search" id="filter-search" placeholder="Search Expense">
    </section>

  <section class="expense-table">
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Title</th>
                    <th>Category</th>
                    <th>Payment</th>
                    <th>Amount</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
           
            <tbody id="expense-table-body">
                <tr>
                    <td>25 Jul</td>
                    <td>Pizza</td>
                    <td>Food</td>
                    <td>UPI</td>
                    <td style="color: red; font-weight: bold;">-₹450</td>
                    <td><span style="background: #dcfce7; color: #16a34a; padding: 2px 8px; border-radius: 10px;">Paid</span></td>
                 
                    <td>
                        <button style="border:none; background:none; color:blue; cursor:pointer;">✏️ Edit</button> 
                        <button style="border:none; background:none; color:red; cursor:pointer;">🗑️ Delete</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </section>

<section class="expense-bottom">
       
   <div class="recent-receipts">
            <h2>Recent Receipts</h2>
            <div class="receipt-grid">
                <div class="receipt-box">
                    <span style="font-size: 24px;">📄</span>
                    <p>Pizza_Bill.jpg</p>
                </div>
                <div class="receipt-box">
                    <span style="font-size: 24px;">📄</span>
                    <p>Shoes.pdf</p>
                </div>
                
                <!--  UPDATE: Upload Wala Box -->
                <div class="receipt-box add-new" onclick="document.getElementById('receipt-upload').click()">
                    <span style="font-size: 24px;">+</span>
                    <p>Upload</p>
                </div>
                
                <!--  UPDATE: Hidden File Input (Ye screen par nahi dikhega) -->
                <input type="file" id="receipt-upload" accept="image/*, .pdf" style="display: none;">
                
            </div>
        </div>

        <!-- Chart Section -->
        <div class="expense-report">
            <h2>Category Summary</h2>
            <div style="width: 100%; height: 200px; display: flex; justify-content: center;">
                <canvas id="categoryPieChart"></canvas>
            </div>
        </div>
    </section>

</main>
<!-- Add Expense Popup (Modal) -->
    <div id="expense-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Add New Expense</h2>
            
            <form id="expense-form">
                <label>Date</label>
                <input type="date" id="exp-date" required>
                <label>Time</label>
                <input type="time" id="exp-time" required>

                <label>Title</label>
                <input type="text" id="exp-title" placeholder="e.g. Zomato, Shoes" required>

                
                <label>Category</label>
                <select id="exp-category">
                    <option value="Food">Food</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Utility">Utility</option>
                    <option value="Fuel">Fuel</option>
                    <option value="Other">Other</option>
                </select>

                <label>Payment Mode</label>
                <select id="exp-payment">
                    <option value="UPI">UPI</option>
                    <option value="Card">Card</option>
                    <option value="Cash">Cash</option>
                </select>

                <label>Amount (₹)</label>
                <input type="number" id="exp-amount" placeholder="e.g. 500" required>

                <button type="submit" class="save-btn">Save Expense</button>
            </form>
        </div>
    </div>
  </div>   
</body>
</html>
