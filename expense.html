<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="expense.css">
</head>
<body>
    <main class="expenses-page">

    <section class="page-header">

        <h1>Expenses</h1>

        <button class="add-expense-btn">
            + Add Expense
        </button>

    </section>

    <section class="expense-summary">

        <div class="summary-card">
            Total Expense
        </div>

        <div class="summary-card">
            This Month
        </div>

        <div class="summary-card">
            Categories
        </div>

        <div class="summary-card">
            Budget Left
        </div>

    </section>

    <section class="expense-filter">

        <select>

            <option>Category</option>

        </select>

        <select>

            <option>Payment</option>

        </select>

        <input
        type="date">

        <input
        type="search"
        placeholder="Search Expense">

    </section>

    <section class="expense-table">

        <table>

            <thead>

                <tr>

                    <th>Date</th>

                    <th>Title</th>

                    <th>Category</th>

                    <th>Payment</th>

                    <th>Amount</th>

                    <th>Status</th>

                    <th>Action</th>

                </tr>

            </thead>

            <tbody>

                <tr>

                    <td>25 Jul</td>

                    <td>Pizza</td>

                    <td>Food</td>

                    <td>UPI</td>

                    <td>₹450</td>

                    <td>Paid</td>

                    <td>Edit Delete</td>

                </tr>

            </tbody>

        </table>

    </section>

    <section class="expense-bottom">

        <div class="recent-receipts">

            <h2>Recent Receipts</h2>

        </div>

        <div class="expense-report">

            <h2>Expense Summary</h2>

        </div>

    </section>

</main>
</body>
</html>
